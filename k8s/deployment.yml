apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-deployment
spec:
  replicas: 2
  selector:
    metadata:
      matchLabels:
        app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
        - name: my_calculator
          image: dockerhub-rohitkutty288/webhook-cal:latest
          ports:
            - containerPorts: 5000
