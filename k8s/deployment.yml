apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
        - name: my-calculator
          image: dockerhub-rohitkutty288/webhook-cal:latest
          ports:
            - containerPort: 5000
